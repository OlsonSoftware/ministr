name: Release automation

# ===================== THE RELEASE CONTRACT =========================
# Releases are cut from THIS repository and ship the MIT `ministr-cli`
# binary. The only supported way to cut a release:
#
#   1. land work on `main` (Conventional Commits)
#   2. bump the version by hand — see RELEASE.md for the exact file list
#      (7 crate Cargo.toml + 7 [workspace.dependencies] pins + Cargo.lock
#      + a CHANGELOG section) — and commit it as `chore: release vX.Y.Z`
#   3. run this workflow (Actions → Release automation → Run workflow)
#   4. it BUILDS every artifact first, then tags, then publishes the
#      GitHub Release with the artifacts + SHA256SUMS attached
#
# BUILD-THEN-TAG. `tag` needs `build`, so a tag can only exist for a
# commit whose full 4-target release matrix went green. A failed build
# leaves nothing to clean up — no tag, no release, no orphaned assets.
#
# 2026-08-15 — this replaced two things that did not work:
#
#   * the Copilot-cloud-agent release-PR lane (`request-release`), which
#     had 122 unanswered handoff prompts and last succeeded before
#     v0.6.0. Version bumping is a documented manual step now.
#   * the F31.5 cross-repo split, which pushed the tag here and then
#     dispatched ministr-private to build `ministr-cli-cloud` — a
#     PROPRIETARY crate whose [[bin]] is also named `ministr` — and
#     upload it to this repo's releases. That made the artifact people
#     downloaded as "the MIT ministr" the closed cloud build, and it
#     could never run anyway: ministr-private has zero Actions secrets.
#     The public download is now built from the public MIT source, here.
#
# ministr-private keeps its own release.yml for a future cloud-only
# artifact; it is no longer on the public download path.
#
# Prerequisites: none beyond the built-in GITHUB_TOKEN and the SCCACHE_*
# secrets release.yml already consumes. That is the point.
# ====================================================================

on:
  # Manual for now. Re-add `push: branches: [main]` once this has cut a
  # release end-to-end at least once.
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Release even when HEAD is not a `chore: release vX.Y.Z` commit.
          Recovery escape hatch — the version must still be untagged.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # SINGLE SOURCE OF TRUTH for release state. Computed ONCE here so the
  # consumers cannot disagree about "what version is this and is it
  # already tagged?" (two divergent paths were the root cause of the
  # #123 silent miss).
  # ─────────────────────────────────────────────────────────────────────
  state:
    name: Resolve release state
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'OlsonSoftware' }}
    outputs:
      version: ${{ steps.s.outputs.version }}
      tagged: ${{ steps.s.outputs.tagged }}
      last_tag: ${{ steps.s.outputs.last_tag }}
      release_commit: ${{ steps.s.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: s
        shell: bash
        run: |
          set -euo pipefail

          ver="$(grep -m1 '^version' ministr-cli/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ -n "$ver" ] || { echo "::error::cannot parse version from ministr-cli/Cargo.toml"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null 2>&1; then
            tagged=true
          else
            tagged=false
          fi
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

          # No blanket `|| true` swallow: "no v* tag yet" is a distinct,
          # logged state vs a git failure. After the 2026-08 tag purge
          # this is the normal state until the first release lands.
          if last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)"; then
            :
          else
            last_tag=""
            echo "::notice::no v* tag reachable from HEAD"
          fi
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"

          # Is HEAD the release-bump commit? Subject `chore: release vX`.
          subject="$(git log -1 --format=%s)"
          release_commit=false
          case "$subject" in
            "chore: release v$ver"*) release_commit=true ;;
          esac
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "::notice::state: version=$ver tagged=$tagged release_commit=$release_commit last_tag=${last_tag:-<none>}"

  # Decide whether to build+tag+publish. Requires the manifest version to
  # be UNTAGGED, plus either a `chore: release vX.Y.Z` HEAD or an
  # explicit `force` dispatch input.
  gate:
    name: Detect pending release
    needs: state
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'OlsonSoftware' }}
    outputs:
      is_release: ${{ steps.d.outputs.is_release }}
      version: ${{ needs.state.outputs.version }}
      prerelease: ${{ steps.d.outputs.prerelease }}
    steps:
      - id: d
        env:
          VER: ${{ needs.state.outputs.version }}
          TAGGED: ${{ needs.state.outputs.tagged }}
          RELEASE_COMMIT: ${{ needs.state.outputs.release_commit }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TAGGED" = true ]; then
            echo "::error::v$VER is already tagged — bump the version before releasing"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_COMMIT" = true ] || [ "$FORCE" = true ]; then
            echo "::notice::v$VER untagged and releasable — build → tag → publish"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::v$VER is untagged but HEAD is not 'chore: release v$VER'. Commit the bump with that subject, or re-run with force=true."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

          # A SemVer prerelease (1.0.0-beta.1) carries a hyphen in the
          # version core. Mark those as GitHub prereleases so `latest`
          # keeps pointing at the newest STABLE release. install.sh
          # resolves prereleases explicitly — see its find_tag().
          case "$VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Build every release artifact for THIS commit, before any tag exists.
  # release.yml is a build-only reusable workflow: 4-target matrix →
  # cargo build -p ministr-cli → package → per-file .sha256 → one
  # `release-artifacts` bundle with a unified SHA256SUMS.
  build:
    name: Build release artifacts
    needs: gate
    if: ${{ needs.gate.outputs.is_release == 'true' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit

  # Only now — after a fully green matrix — does the tag exist.
  tag:
    name: Push tag v<X.Y.Z>
    needs: [gate, build]
    if: ${{ needs.gate.outputs.is_release == 'true' }}
    concurrency:
      group: release-tag-v${{ needs.gate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push tag
        env:
          VER: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "tag v$VER already exists — skipping create"
          else
            git tag -a "v$VER" -m "v$VER"
            git push origin "refs/tags/v$VER"
          fi

  # Publish the GitHub Release with every artifact attached. Uses `gh`
  # + the built-in GITHUB_TOKEN rather than a third-party action, so
  # there is no extra commit SHA to pin and audit.
  publish:
    name: Publish GitHub Release
    needs: [gate, tag]
    if: ${{ needs.gate.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reusable-workflow jobs upload into the CALLER's run, so the
      # bundle `build` produced is retrievable here by name.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      # Release notes = this version's CHANGELOG section, verbatim. A
      # missing section is a hard error: shipping a release whose notes
      # silently degrade to "see the changelog" is how changelogs rot.
      - name: Extract release notes
        env:
          VER: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, pathlib

          ver = os.environ["VER"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # Match `## [1.0.0-beta.1] ...` or `## 1.0.0-beta.1 ...`, then
          # take everything up to the next `## ` heading.
          pattern = re.compile(
              r"^##\s+\[?" + re.escape(ver) + r"\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
              re.S | re.M,
          )
          m = pattern.search(text)
          if not m:
              sys.exit(f"::error::no CHANGELOG.md section for {ver} — write one before releasing")

          body = m.group(1).strip()
          if not body:
              sys.exit(f"::error::CHANGELOG.md section for {ver} is empty")

          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"::notice::release notes: {len(body)} chars from CHANGELOG.md")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)

          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::notice::release v$VER exists — uploading assets (clobbering same-named)"
            gh release upload "v$VER" artifacts/* --clobber
          else
            gh release create "v$VER" artifacts/* \
              --title "v$VER" \
              --notes-file release-notes.md \
              "${flags[@]}"
          fi

          echo "::notice::published https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VER"
