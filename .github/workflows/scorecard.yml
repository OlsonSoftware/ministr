name: Scorecard

# OpenSSF Scorecard — supply-chain health checks (branch protection, pinned
# dependencies, token permissions, dangerous workflow patterns, …). Results
# land in the repo's Security → Code scanning tab alongside CodeQL.
#
# Runs weekly and on pushes to the default branch. It deliberately does NOT
# run on pull_request: Scorecard's repo-level checks need the default-branch
# context, and a fork PR cannot be granted `security-events: write`.

on:
  branch_protection_rule:
  schedule:
    # Mondays 07:20 UTC — offset off the hour to avoid Actions' scheduling peak.
    - cron: '20 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Default to no permissions; each job opts into exactly what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Publish the result to the public OpenSSF API (deps.dev / the badge).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results feeds the public Scorecard API, which is what backs
          # the README badge and the deps.dev entry. It needs no PAT — the
          # id-token permission above is the whole authentication story.
          publish_results: true

      # Keep the raw SARIF for 5 days so a failed upload is still diagnosable.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
