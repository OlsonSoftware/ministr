[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
# (The former glib/rand ignores were pulled in only via the Tauri desktop
# app, removed in the GUI v8 reset — no ignores needed for the CLI stack.)
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
# ministr's open-core workspace crates are MIT-licensed and `publish =
# false`. cargo-deny's license policy governs *third-party* dependencies;
# ignore our unpublished workspace crates so the policy below applies only
# to deps. (Closed-source cloud/enterprise/atlas crates added in later
# phases ship LicenseRef-Proprietary and remain covered by this same
# `private = { ignore = true }` switch.)
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Unreal-aware C++ grammar — strict superset of tree-sitter-cpp,
    # not yet published on crates.io. Pinned to a specific commit in
    # ministr-core/Cargo.toml. Drop this allow-entry once upstream
    # publishes a release crate.
    "https://github.com/taku25/tree-sitter-unreal-cpp",
]
